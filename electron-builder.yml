appId: com.siever.siever-mail
productName: SIEVER Mail
directories:
  buildResources: build
files:
  # Allow-list: bundle only what is loaded at runtime. The previous deny-list
  # ('**/*' minus a handful of paths) bloated the public app.asar to ~225 MB
  # by sweeping in the private extension/ drop-in, archivio_test/ (personal
  # mail), electron-starter-003/, dev/ crash reports, docs/, build*.mjs and
  # the prisma/ source — none of which are touched at runtime, and some of
  # which are confidential. Vite already inlines the extension code into
  # out/main/index.js at build time, so the source folder never needs to ship.
  - 'package.json'
  - 'out/**/*'
  - 'resources/**/*'
  - 'node_modules/**/*'
  - from: node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
extraResources:
  - from: .env
    to: .env
asarUnpack:
  - resources/**
win:
  executableName: SIEVER Mail
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
mac:
  # The CI matrix builds without a Developer ID certificate, so electron-builder
  # falls back to ad-hoc signatures. macOS Sequoia enforces library validation
  # whenever the Hardened Runtime flag is set, and ad-hoc-signed frameworks fail
  # that check ("non-platform but different Team IDs") even though every binary
  # in the bundle uses the same empty identity. Disabling Hardened Runtime keeps
  # the bundle launchable from a quarantined download. We don't lose anything in
  # return because we don't notarize and there is no Developer ID to enforce.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: siever
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
