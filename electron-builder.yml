appId: com.siever.siever-mail
productName: SIEVER Mail
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!dist/**/*'
  - '!release/**/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - from: node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
extraResources:
  - from: .env
    to: .env
asarUnpack:
  - resources/**
win:
  executableName: SIEVER Mail
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
mac:
  # The CI matrix builds without a Developer ID certificate, so electron-builder
  # falls back to ad-hoc signatures. macOS Sequoia enforces library validation
  # whenever the Hardened Runtime flag is set, and ad-hoc-signed frameworks fail
  # that check ("non-platform but different Team IDs") even though every binary
  # in the bundle uses the same empty identity. Disabling Hardened Runtime keeps
  # the bundle launchable from a quarantined download. We don't lose anything in
  # return because we don't notarize and there is no Developer ID to enforce.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: siever
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
