appId: com.siever.siever-mail
productName: SIEVER Mail
directories:
  buildResources: build
files:
  # Allow-list: bundle only what is loaded at runtime. The previous deny-list
  # ('**/*' minus a handful of paths) bloated the public app.asar to ~225 MB
  # by sweeping in the private extension/ drop-in, archivio_test/ (personal
  # mail), electron-starter-003/, dev/ crash reports, docs/, build*.mjs and
  # the prisma/ source — none of which are touched at runtime, and some of
  # which are confidential. Vite already inlines the extension code into
  # out/main/index.js at build time, so the source folder never needs to ship.
  - 'package.json'
  - 'out/**/*'
  - 'resources/**/*'
  - 'node_modules/**/*'
  - from: node_modules/.prisma/client
    to: node_modules/.prisma/client
    filter:
      - '**/*'
extraResources:
  - from: .env
    to: .env
asarUnpack:
  - resources/**
win:
  executableName: SIEVER Mail
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  deleteAppDataOnUninstall: false
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  include: build/installer.nsh
mac:
  # The mac signing/notarization toggles default to OFF here and are
  # turned on dynamically by build.mjs when both a Developer ID
  # Application certificate (in the local keychain or imported via
  # CSC_LINK in CI) AND the App Store Connect API credentials
  # (APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER) are
  # available. That keeps two paths working from the same config:
  #   1. Full signed-and-notarized build (cert + ASC creds present) —
  #      build.mjs flips hardenedRuntime + notarize to true; the DMG
  #      opens with no Gatekeeper prompt and no quarantine warning.
  #   2. Quick ad-hoc smoke build (no cert) — build.mjs leaves the
  #      defaults as-is; the bundle is ad-hoc signed and launches via
  #      right-click Open. See "ad-hoc fallback path" in build.mjs.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Electron 44's Chromium needs macOS 13 (Ventura): an older Mac is told so
  # by the system instead of getting an app that does not start.
  minimumSystemVersion: '13.0'
  # What the system says when SIEVER Mail first reaches each place: the
  # folders attachments are saved to and attached from, the company's shares.
  extendInfo:
    - NSDesktopFolderUsageDescription: SIEVER Mail salva gli allegati e allega i file che tieni sulla Scrivania.
    - NSDocumentsFolderUsageDescription: SIEVER Mail salva gli allegati e allega i file della cartella Documenti.
    - NSDownloadsFolderUsageDescription: SIEVER Mail salva gli allegati e allega i file della cartella Download.
    - NSNetworkVolumesUsageDescription: SIEVER Mail archivia i messaggi e allega i file dalle cartelle di rete dell'azienda.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: siever
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
